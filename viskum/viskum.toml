[package]
name = "viskum"

[c-deps]


arg = "llc -filetype=obj ./viskum/dist/main.ll && ld64.lld -arch arm64 -platform_version macos 15.0 12.0 ./viskum/dist/main.o -o main /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib/crt1.o -L/Library/Developer/CommandLineTools/SDKs/MacOSX.sdk/usr/lib -lSystem"


build_and_link = "clang ./hello.c -o ./hello -I/opt/homebrew/opt/llvm/include -L/opt/homebrew/opt/llvm/lib -lLLVM"